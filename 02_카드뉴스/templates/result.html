<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ topic }} — 카드뉴스 결과</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #ECE5D3;
  color: #1A1A1A;
  font-family: 'Pretendard', -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-feature-settings: "tnum";
  padding: 48px 24px 80px;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1180px; margin: 0 auto; }
.head {
  display: flex; justify-content: space-between; align-items: baseline;
  border-bottom: 2px solid #1A1A1A;
  padding-bottom: 14px; margin-bottom: 24px;
}
.head .l, .head .r { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #4A4540; font-weight: 600; }
h1 { font-size: 40px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.15; margin-bottom: 8px; }
.src { font-size: 13px; color: #4A4540; word-break: break-all; margin-bottom: 28px; }
.src a { color: #7A2E2E; text-decoration: none; }
.src a:hover { text-decoration: underline; }
.actions {
  display: flex;
  gap: 12px;
  margin-bottom: 36px;
  flex-wrap: wrap;
  align-items: center;
}
.actions a, .actions button {
  padding: 15px 24px;
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
  border-radius: 4px;
  border: none;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: 0.05em;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.18s;
}
.btn-primary { background: #1A1A1A; color: #F5F1E8; }
.btn-primary:hover { background: #7A2E2E; }
.btn-primary .big { font-size: 18px; font-weight: 800; }
.btn-ghost { background: transparent; color: #1A1A1A; border: 1.5px solid #1A1A1A; }
.btn-ghost:hover { background: #1A1A1A; color: #F5F1E8; }
.actions .hint { font-size: 12px; color: #8A8479; margin-left: 4px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 18px;
}
figure {
  background: #F5F1E8;
  padding: 14px;
  border-radius: 4px;
  box-shadow: 0 1px 0 rgba(26,26,26,0.06);
  transition: transform 0.18s;
}
figure:hover { transform: translateY(-2px); }
figure img { width: 100%; height: auto; display: block; border-radius: 2px; }
figcaption {
  font-size: 12px;
  color: #4A4540;
  margin-top: 12px;
  letter-spacing: 0.04em;
  font-weight: 600;
  line-height: 1.4;
}
figcaption .num { color: #7A2E2E; font-weight: 800; margin-right: 4px; }
.individual {
  display: inline-block;
  font-size: 10px;
  color: #8A8479;
  margin-top: 8px;
  text-decoration: none;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 600;
}
.individual:hover { color: #7A2E2E; }
footer {
  margin-top: 56px; padding-top: 16px;
  border-top: 1px solid #D8D0BC;
  font-size: 10px; color: #8A8479;
  text-align: center; letter-spacing: 0.2em; text-transform: uppercase;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="l">Card News · Result</div>
    <div class="r">Poomda · Auto Card</div>
  </div>
  <h1>{{ topic }}</h1>
  <div class="src">
    {% if source.startswith('http') %}
      <a href="{{ source }}" target="_blank" rel="noopener">{{ source }} ↗</a>
    {% else %}
      {{ source }}
    {% endif %}
  </div>

  <div class="actions">
    <a class="btn-primary" href="/output/{{ stamp }}_cards.zip" download>
      <span class="big">📥</span> 5장 한 번에 다운로드 (ZIP)
    </a>
    <a class="btn-ghost" href="/">← 새 카드뉴스 만들기</a>
    <span class="hint">개별 다운로드는 각 카드 아래 링크</span>
  </div>

  <div class="grid">
    {% for card in cards %}
    <figure>
      <img src="/output/{{ stamp }}_{{ '%02d'|format(loop.index) }}.png" alt="card {{ loop.index }}" loading="lazy">
      <figcaption>
        <span class="num">{{ '%02d'|format(loop.index) }}</span>{{ card.headline[:42] }}
      </figcaption>
      <a class="individual" href="/output/{{ stamp }}_{{ '%02d'|format(loop.index) }}.png" download>↓ 개별 다운로드</a>
    </figure>
    {% endfor %}
  </div>

  <footer>Generated · Poomda Auto Card · Signature Demo ②</footer>
</div>
</body>
</html>
