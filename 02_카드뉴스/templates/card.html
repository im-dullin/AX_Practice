<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Card</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
* {{ margin: 0; padding: 0; box-sizing: border-box; }}
body {{
  width: 1080px;
  height: 1080px;
  background: #F5F1E8;
  color: #1A1A1A;
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-feature-settings: "ss01", "tnum";
  -webkit-font-smoothing: antialiased;
  position: relative;
  overflow: hidden;
}}
.frame {{
  padding: 90px 80px 70px;
  height: 100%;
  display: flex;
  flex-direction: column;
}}
.top {{
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 14px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #4A4540;
  font-weight: 600;
  border-bottom: 2px solid #1A1A1A;
  padding-bottom: 18px;
  margin-bottom: 56px;
}}
.body {{ flex: 1; display: flex; flex-direction: column; justify-content: center; }}
.label {{
  font-size: 15px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: #7A2E2E;
  font-weight: 800;
  margin-bottom: 18px;
}}
.accent-line {{
  width: 80px;
  height: 4px;
  background: #7A2E2E;
  margin-bottom: 36px;
}}
.headline {{
  font-size: 60px;
  font-weight: 800;
  letter-spacing: -0.028em;
  line-height: 1.16;
  margin-bottom: 30px;
  color: #1A1A1A;
  word-break: keep-all;
}}
.text {{
  font-size: 24px;
  line-height: 1.6;
  color: #4A4540;
  word-break: keep-all;
}}
.bottom {{
  margin-top: auto;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-top: 24px;
  border-top: 1px solid #ECE5D3;
}}
.counter {{
  font-size: 56px;
  font-weight: 800;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  color: #1A1A1A;
  line-height: 1;
}}
.counter .total {{
  color: #8A8479;
  font-weight: 600;
  margin-left: 6px;
}}
.brand {{
  text-align: right;
  font-size: 12px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: #4A4540;
  font-weight: 700;
}}
.brand .src {{
  display: block;
  color: #8A8479;
  font-size: 10px;
  letter-spacing: 0.04em;
  text-transform: none;
  font-weight: 500;
  margin-top: 6px;
  max-width: 400px;
  word-break: break-all;
}}

/* Cover — 큰 헤드라인 */
body.cover .headline {{ font-size: 80px; line-height: 1.08; letter-spacing: -0.035em; }}
body.cover .text {{ font-size: 26px; }}

/* Outro — 다크 인버스 */
body.outro {{ background: #1A1A1A; color: #F5F1E8; }}
body.outro .top {{ color: rgba(245,241,232,0.6); border-color: rgba(245,241,232,0.3); }}
body.outro .accent-line {{ background: #C9A86E; }}
body.outro .headline {{ color: #F5F1E8; font-size: 68px; }}
body.outro .text {{ color: rgba(245,241,232,0.85); font-size: 26px; }}
body.outro .counter {{ color: #F5F1E8; }}
body.outro .counter .total {{ color: rgba(245,241,232,0.45); }}
body.outro .bottom {{ border-color: rgba(245,241,232,0.2); }}
body.outro .brand {{ color: rgba(245,241,232,0.6); }}
body.outro .brand .src {{ color: rgba(245,241,232,0.4); }}
</style>
</head>
<body class="{kind}">
<div class="frame">
  <div class="top">
    <span>{topic}</span>
    <span>Auto Card · Poomda</span>
  </div>
  <div class="body">
    {label_html}
    <div class="accent-line"></div>
    <h1 class="headline">{headline}</h1>
    <p class="text">{text}</p>
  </div>
  <div class="bottom">
    <div class="counter">{n_str}<span class="total">/ {total}</span></div>
    <div class="brand">
      <div>Card News</div>
      <span class="src">{source}</span>
    </div>
  </div>
</div>
</body>
</html>
