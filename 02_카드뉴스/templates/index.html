<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{topic} — 카드뉴스 미리보기</title>
<style>
* {{ margin: 0; padding: 0; box-sizing: border-box; }}
body {{
  background: #ECE5D3;
  color: #1A1A1A;
  font-family: 'Pretendard', -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-feature-settings: "tnum";
  padding: 48px 24px 80px;
  -webkit-font-smoothing: antialiased;
}}
.wrap {{ max-width: 1180px; margin: 0 auto; }}
.head {{
  display: flex; justify-content: space-between; align-items: baseline;
  border-bottom: 2px solid #1A1A1A;
  padding-bottom: 14px; margin-bottom: 26px;
}}
.head .l, .head .r {{ font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #4A4540; font-weight: 600; }}
h1 {{ font-size: 38px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.15; margin-bottom: 10px; }}
.src {{ font-size: 13px; color: #4A4540; word-break: break-all; margin-bottom: 32px; }}
.grid {{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 18px;
}}
figure {{
  background: #F5F1E8;
  padding: 14px;
  border-radius: 4px;
  box-shadow: 0 1px 0 rgba(26,26,26,0.06);
}}
figure img {{
  width: 100%; height: auto; display: block;
  border-radius: 2px;
}}
figcaption {{
  font-size: 12px;
  color: #4A4540;
  margin-top: 12px;
  letter-spacing: 0.05em;
  font-weight: 600;
  line-height: 1.4;
}}
footer {{
  margin-top: 56px; padding-top: 16px;
  border-top: 1px solid #D8D0BC;
  font-size: 10px; color: #8A8479;
  text-align: center; letter-spacing: 0.18em; text-transform: uppercase;
}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="l">Card News · Auto-generated</div>
    <div class="r">Poomda</div>
  </div>
  <h1>{topic}</h1>
  <div class="src">{source}</div>
  <div class="grid">
    {cells}
  </div>
  <footer>Generated {generated_at} · Poomda Auto Card</footer>
</div>
</body>
</html>
