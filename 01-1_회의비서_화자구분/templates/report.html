<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{title} — 회의 리포트</title>
<style>
:root {{
  --paper: #F5F1E8;
  --paper-2: #ECE5D3;
  --ink: #1A1A1A;
  --ink-2: #4A4540;
  --ink-3: #8A8479;
  --accent: #7A2E2E;
}}
* {{ box-sizing: border-box; margin: 0; padding: 0; }}
html, body {{ background: var(--paper); color: var(--ink); }}
body {{
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Pretendard", "Apple SD Gothic Neo", sans-serif;
  font-feature-settings: "ss01", "tnum";
  line-height: 1.6;
  padding: 48px 24px 80px;
  -webkit-font-smoothing: antialiased;
}}
.wrap {{ max-width: 880px; margin: 0 auto; }}
.head {{
  display: flex; justify-content: space-between; align-items: baseline;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 14px; margin-bottom: 28px;
}}
.head .l, .head .r {{ font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }}
h1 {{ font-size: 34px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.15; margin: 8px 0 8px; }}
.date {{ font-size: 14px; color: var(--ink-2); margin-bottom: 36px; font-variant-numeric: tabular-nums; }}
section {{ margin-bottom: 32px; }}
section h2 {{
  font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--accent); font-weight: 700;
  margin-bottom: 12px; padding-bottom: 6px;
  border-bottom: 1px solid var(--paper-2);
}}
.summary {{ font-size: 17px; line-height: 1.7; color: var(--ink); }}
.actions {{ list-style: none; }}
.actions li {{
  display: grid;
  grid-template-columns: 110px 1fr 110px;
  gap: 16px;
  padding: 12px 0;
  border-bottom: 1px solid var(--paper-2);
  align-items: baseline;
}}
.actions .who {{ font-weight: 700; color: var(--accent); font-size: 14px; }}
.actions .what {{ font-size: 15px; color: var(--ink); }}
.actions .due {{ font-size: 13px; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }}
.actions .due:empty::before {{ content: "—"; color: var(--ink-3); }}
ul.list {{ list-style: none; padding-left: 0; }}
ul.list li {{ padding: 6px 0 6px 18px; position: relative; font-size: 15px; line-height: 1.55; }}
ul.list li::before {{ content: ""; position: absolute; left: 0; top: 14px; width: 10px; height: 1px; background: var(--accent); }}
.empty {{ font-size: 13px; color: var(--ink-3); padding: 6px 0; }}
details {{ margin-top: 36px; border-top: 1px solid var(--paper-2); padding-top: 16px; }}
details summary {{
  cursor: pointer; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ink-2); padding: 6px 0; font-weight: 600;
  list-style: none;
}}
details summary::before {{ content: "▸ "; color: var(--accent); }}
details[open] summary::before {{ content: "▾ "; }}
.transcript {{
  background: var(--paper-2);
  padding: 20px 22px;
  border-radius: 4px;
  font-size: 13px; line-height: 1.75;
  color: var(--ink-2);
  max-height: 420px; overflow-y: auto;
  margin-top: 10px;
}}
.transcript .t-line {{
  padding: 4px 0;
  font-family: 'Pretendard', -apple-system, sans-serif;
}}
.transcript .t-speaker {{
  display: inline-block;
  min-width: 90px;
  letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
  margin-right: 8px;
}}
.transcript .t-text {{ color: var(--ink); }}
footer {{
  margin-top: 56px; padding-top: 16px;
  border-top: 1px solid var(--paper-2);
  font-size: 10px; color: var(--ink-3);
  text-align: center; letter-spacing: 0.18em; text-transform: uppercase;
}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="l">Meeting Report · Auto-generated</div>
    <div class="r">Poomda · 회의 비서</div>
  </div>
  <h1>{title}</h1>
  <div class="date">{date}</div>

  <section>
    <h2>핵심 요약</h2>
    <div class="summary">{summary}</div>
  </section>

  <section>
    <h2>액션 아이템</h2>
    {actions_block}
  </section>

  <section>
    <h2>결정 사항</h2>
    {decisions_block}
  </section>

  <section>
    <h2>남은 리스크</h2>
    {risks_block}
  </section>

  <details>
    <summary>회의 전문 보기</summary>
    <div class="transcript">{transcript}</div>
  </details>

  <footer>Generated {generated_at} · Poomda Meeting Assistant</footer>
</div>
</body>
</html>
